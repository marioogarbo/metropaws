[project]
name = "metropaws-api"
version = "0.1.0"
description = "A RESTful API for managing pet information, appointments, and user authentication for a pet care service."
readme = "README.md"
requires-python = ">=3.13"
# Kept in step with requirements.txt, which is what the Docker image installs.
# Pinned exactly rather than with ranges: an unpinned fastapi meant local and
# production ran different versions without anyone choosing that.
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.5.0",
    "uvicorn[standard]==0.46.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.1",
    "pydantic[email]==2.13.4",
    "pillow==11.0.0",
    "qrcode[pil]==8.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "fpdf2==2.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py313"
exclude = [".venv"]
line-length = 120

[tool.ruff.lint]
# Ruff's defaults (E4/E7/E9 + F) plus bugbear, comprehensions, returns and
# simplifications.
#
# Deliberately NOT enabled, because both fire on correct FastAPI code:
#   ARG — every route handler takes `current_user` solely to apply the auth
#         guard. It is unused on purpose; that IS the mechanism.
#   UP  — Optional[...]/List[...] is used consistently across the codebase.
#         Modernising it is a deliberate sweep, not a lint gate.
select = ["E4", "E7", "E9", "F", "B", "C4", "RET", "SIM"]
ignore = [
    # SQLAlchemy filters need `Column == True`. `if Column:` does not build SQL,
    # it evaluates the column object's truthiness — a silent behaviour change.
    "E712",
    # `import models, schemas, auth as auth_utils` is the house style here.
    "E401",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's entire dependency system is function calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is a package now, so this is where `import app.…`, `scripts.…` and
# `tests.…` all resolve from.
# The backend is a flat set of modules imported as `import models` etc., so the
# package root has to be on sys.path for the tests to import the same way the
# app does.
pythonpath = ["."]
addopts = "-q"
