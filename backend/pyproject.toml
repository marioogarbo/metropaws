[project]
name = "metropaws-api"
version = "0.1.0"
description = "A RESTful API for managing pet information, appointments, and user authentication for a pet care service."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.1",
    "pydantic[email]>=2.11.0",
    "pillow==11.0.0",
    "qrcode[pil]==8.0",
    "alembic==1.14.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "fpdf2==2.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The backend is a flat set of modules imported as `import models` etc., so the
# package root has to be on sys.path for the tests to import the same way the
# app does.
pythonpath = ["."]
addopts = "-q"
